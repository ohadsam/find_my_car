name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'index.html'
      - 'style.css'
      - 'manifest.json'
      - 'sw.js'
      - 'icons/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/prepare-www.mjs'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

# contents: write is needed only by the "Publish APK as a GitHub release" step.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A syntax error in any shipped JS file stops the whole app from
      # starting, and nothing downstream notices: cap:sync only copies files
      # and Gradle happily packages a broken asset into a green APK. This
      # gate is deliberately before everything else — see
      # scripts/check-syntax.mjs for the outage that prompted it.
      - name: Check JS syntax
        run: npm run check:syntax

      - name: Run unit tests
        run: npx vitest run

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Stage web assets + sync Capacitor
        run: npm run cap:sync

      - name: Run native unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: findmycar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload native test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findmycar-native-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      # The in-app updater (js/updater.js, AppUpdatePlugin.kt) and the share
      # link both read the newest GitHub release, so every build of main
      # publishes its APK there under a STABLE file name: the same
      # releases/latest/download/FindMyCar.apk URL always serves the newest build.
      # One release per versionName; a rebuild of the same version replaces the
      # asset instead of piling up releases. Notes come from CHANGELOG.md.
      - name: Publish APK as a GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -1)
          [ -n "$VERSION" ] || { echo "could not read versionName"; exit 1; }
          TAG="v$VERSION"
          cp android/app/build/outputs/apk/debug/app-debug.apk FindMyCar.apk
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md | head -n 40 > release-notes.md
          [ -s release-notes.md ] || echo "FindMyCar $VERSION" > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" FindMyCar.apk --clobber
            gh release edit "$TAG" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" FindMyCar.apk --target "$GITHUB_SHA" --title "FindMyCar $VERSION" --notes-file release-notes.md --latest
          fi
